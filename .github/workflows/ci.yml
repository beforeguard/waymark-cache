name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Waymark.Cache.slnx
      - run: dotnet build Waymark.Cache.slnx --no-restore --configuration Release
      - run: dotnet test Waymark.Cache.slnx --no-build --configuration Release

